name: Release

permissions:
  contents: write

env:
  TURBO_TELEMETRY_DISABLED: '1'

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm check:privacy
      - run: pnpm check:contracts
      - run: pnpm check:release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@toolbox/monitor-choice exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
      - run: pnpm test:browser
      - run: pnpm lint

      - name: Extract release notes
        run: node scripts/extract-release-notes.mjs "${{ github.ref_name }}" > "${{ runner.temp }}/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
